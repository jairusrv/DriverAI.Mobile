name: driverai_mobile
description: DriverAI - Análisis de rentabilidad para viajes de Uber/Didi
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  path: ^1.9.0

  # Core
  riverpod: ^2.5.0
  flutter_riverpod: ^2.5.0
  equatable: ^2.0.5
  dartz: ^0.10.1

  # Networking
  dio: ^5.4.0
  logger: ^2.0.0

  # Storage
  shared_preferences: ^2.2.0
  flutter_secure_storage: ^9.0.0
  sqflite: ^2.3.0
  path_provider: ^2.1.0

  # Device info
  device_info_plus: ^10.1.0

  # UI & Overlay
  overlay_support: ^2.1.0
  permission_handler: ^11.0.0

  # Navigation
  go_router: ^14.0.0

  # Utils
  intl: ^0.19.0
  connectivity_plus: ^6.0.0
  h3_flutter: ^0.6.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/driverai_icon.png"

flutter_native_splash:
  color: "#0F172A"
  image: assets/images/driverai_icon.png
  android: true

google_maps_flutter: ^2.10.0
