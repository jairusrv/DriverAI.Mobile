name: driverai_mobile
description: DriverAI - Análisis de rentabilidad para viajes de Uber/Didi
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter

  # Core
  riverpod: ^2.5.0
  flutter_riverpod: ^2.5.0
  equatable: ^2.0.5
  dartz: ^0.10.1

  # Networking
  dio: ^5.4.0
  logger: ^2.0.0

  # Storage
  shared_preferences: ^2.2.0
  flutter_secure_storage: ^9.0.0
  sqflite: ^2.3.0
  path_provider: ^2.1.0

  # Device info
  device_info_plus: ^10.1.0

  # UI & Overlay
  overlay_support: ^2.1.0
  permission_handler: ^11.0.0

  # Navigation
  go_router: ^14.0.0

  # Utils
  intl: ^0.19.0
  connectivity_plus: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true